apiVersion: v1
kind: PersistentVolume
metadata:
  name: ollama-models-pv
  labels:
    type: local
spec:
  capacity:
    storage: 50Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual  # 手动管理
  local:
    path: /data/ollama/models
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - k8s-node3  # 替换为实际的节点名称
